<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام الرول بلاي الطبي</title>
  <style>
    :root {
      --green: #087c55;
      --bg: #eef5f3;
      --text: #20312c;
      --line: #d6e3df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: white;
      border-bottom: 4px solid var(--green);
      padding: 18px 20px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 6px 0 0; color: #64736e; font-size: 13px; }
    main { max-width: 950px; margin: auto; padding: 20px; }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px #0000000a;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .tab { background: #f0f5f3; color: var(--text); }
    .tab.active, .primary { background: var(--green); color: white; }
    .secondary { background: #edf3f1; color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #bdcec8;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .hidden { display: none; }
    .box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 9px;
      background: #edf8f3;
      border: 1px solid #abd4c4;
      line-height: 1.8;
    }
    .report-card {
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px;
      margin-top: 10px;
      line-height: 1.8;
    }
    .notice {
      background: #fff4cc;
      border: 1px solid #dfc35c;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.9;
    }
    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .tabs { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>النظام الطبي الافتراضي للرول بلاي</h1>
    <p>موقع محاكاة ترفيهي غير رسمي</p>
  </header>

  <main>
    <div class="card">
      <div class="tabs">
        <button class="tab active" type="button" onclick="showTab('open', this)">فتح ملف وحجز</button>
        <button class="tab" type="button" onclick="showTab('check', this)">استعلام الكشف</button>
        <button class="tab" type="button" onclick="showTab('admin', this)">لوحة الإدارة</button>
      </div>

      <section id="open">
        <h2>فتح ملف طبي</h2>
        <form id="openForm">
          <div class="grid">
            <div>
              <label for="name">الاسم</label>
              <input id="name" required>
            </div>
            <div>
              <label for="age">العمر</label>
              <input id="age" type="number" min="1" max="120" required>
            </div>
            <div>
              <label for="roblox">يوزرك في Roblox</label>
              <input id="roblox" required>
            </div>
            <div>
              <label for="job">الوظيفة</label>
              <input id="job" required>
            </div>
            <div>
              <label for="rank">الرتبة الوظيفية</label>
              <input id="rank" required>
            </div>
            <div>
              <label for="reason">سبب فتح الملف</label>
              <textarea id="reason" required></textarea>
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">إنشاء رمز الملف</button>
          </div>
        </form>
        <div id="newCodeResult"></div>
      </section>

      <section id="check" class="hidden">
        <h2>استعلام عن نتيجة الكشف</h2>
        <label for="lookupCode">أدخل رمز الملف</label>
        <input id="lookupCode" placeholder="مثال: MED-123456">
        <div class="actions">
          <button class="primary" type="button" onclick="checkReport()">استعلام</button>
        </div>
        <div id="lookupResult"></div>
      </section>

      <section id="admin" class="hidden">
        <div id="loginPanel">
          <h2>دخول الإدارة</h2>
          <div class="grid">
            <div>
              <label for="adminName">اسم
