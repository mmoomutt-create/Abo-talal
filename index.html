<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الملف الطبي - رول بلاي</title>
<style>
:root{--g:#087c55;--b:#edf5f2;--d:#20312c;--line:#d6e3df}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--b);color:var(--d)}
header{background:#fff;border-bottom:4px solid var(--g);padding:14px 20px}
header h1{font-size:19px;margin:0}
header p{margin:6px 0 0;color:#668078;font-size:12px}
main{max-width:950px;margin:auto;padding:20px}
.notice{background:#fff4c9;border:1px solid #e3cb70;border-radius:10px;padding:11px;margin-bottom:16px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #0000000a}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#f7faf9;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}
.tab.active{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #b8cbc5;border-radius:8px;padding:11px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:bold;cursor:pointer}
.primary{background:var(--g);color:#fff}
.secondary{background:#edf3f1}
.hidden{display:none}
.box{background:#edf8f3;border:1px solid #abd4c4;border-radius:9px;padding:14px;margin-top:14px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.item small{display:block;color:#6d7c77;margin-bottom:5px}
.item strong{direction:ltr;unicode-bidi:isolate}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:8px;text-align:right;font-size:13px}
th{background:#f3f8f6}
@media(max-width:650px){
  .grid,.info{grid-template-columns:1fr}
  .tabs{flex-direction:column}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>

<header>
  <h1>نظام الملف الطبي - المحاكاة الترفيهية</h1>
  <p>الموقع وهمي بالكامل ولا يمثل وزارة أو جهة صحية حقيقية</p>
</header>

<main>
  <div class="notice">
    تنبيه: جميع البيانات والأرقام والرموز وهمية ويجب استخدامها للرول بلاي فقط.
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="showTab('open')">فتح ملف طبي</button>
      <button class="tab" onclick="showTab('check')">ملفي للكشف والحجز</button>
      <button class="tab" onclick="showTab('admin')">إدارة تجريبية</button>
    </div>

    <section id="open">
      <form id="openForm">
        <div class="grid">
          <div>
            <label>١ - الاسم بالكامل</label>
            <input id="fullName" required autocomplete="off">
          </div>

          <div>
            <label>٢ - العمر</label>
            <input id="age" type="number" min="1" max="120" required>
          </div>

          <div>
            <label>٣ - اسمك في Roblox</label>
            <input id="roblox" required autocomplete="off">
          </div>

          <div>
            <label>٤ - الوظيفة</label>
            <input id="job" required>
          </div>

          <div>
            <label>٥ - الرتبة الوظيفية</label>
            <input id="rank" required>
          </div>

          <div>
            <label>٦ - سبب فتح الملف</label>
            <textarea id="reason" required></textarea>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary">تقديم طلب فتح الملف</button>
          <button type="reset" class="secondary">مسح</button>
        </div>
      </form>
    </section>

    <section id="check" class="hidden">
      <div class="grid">
        <div>
          <label>رقم الملف الطبي</label>
          <input id="fileLookup" inputmode="numeric">
        </div>

        <div>
          <label>رمز الملف الخاص بك</label>
          <input id="recordCode" autocomplete="off">
        </div>
      </div>

      <div class="actions">
        <button type="button" class="primary" onclick="lookupFile()">عرض ملفي للحجز</button>
      </div>

      <div id="lookupResult"></div>
    </section>

    <section id="admin" class="hidden">
      <div id="adminLogin">
        <div class="grid">
          <div>
            <label>اسم الإداري التجريبي</label>
            <input id="adminName">
          </div>

          <div>
            <label>الرمز الإداري التجريبي</label>
            <input id="adminPassword" type="password">
          </div>
        </div>

        <div class="actions">
          <button type="button" class="primary" onclick="loginAdmin()">دخول الإدارة</button>
        </div>
      </div>

      <div id="adminPanel" class="hidden">
        <h3>لوحة الإدارة التجريبية</h3>

        <div class="actions">
          <button type="button" class="primary" onclick="downloadReports()">تنزيل تقارير الكشف</button>
          <button type="button" class="secondary" onclick="logoutAdmin()">تسجيل خروج</button>
        </div>

        <div id="adminRecords"></div>
      </div>
    </section>
  </div>
</main>

<script>
const ADMIN_PASSWORD = "Abo3ks3305";

let records = JSON.parse(sessionStorage.getItem("rp_medical_records") || "[]");

function showTab(id) {
  document.querySelectorAll(".tab").forEach((tab, index) => {
    tab.classList.toggle("active",
      (id === "open" && index === 0) ||
      (id === "check" && index === 1) ||
      (id === "admin" && index === 2)
    );
  });

  ["open", "check", "admin"].forEach(section => {
    document.getElementById(section).classList.toggle("hidden", section !== id);
  });

  if (id === "admin") {
    renderAdmin();
  }
}

function randomDigits(length) {
  let result = "";

  for (let i = 0; i < length; i++) {
    result += Math.floor(Math.random() * 10);
  }

  return result;
}

function saveRecords() {
  sessionStorage.setItem("rp_medical_records", JSON.stringify(records));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

document.getElementById("openForm").addEventListener("submit", event => {
  event.preventDefault();

  const record = {
    id: randomDigits(12),
    code: "RP-" + randomDigits(6),
    name: document.getElementById("fullName").value.trim(),
    age: document.getElementById("age").value,
    roblox: document.getElementById("roblox").value.trim(),
    job: document.getElementById("job").value.trim(),
    rank: document.getElementById("rank").value.trim(),
    reason: document.getElementById("reason").value.trim(),
    status: "ملف تجريبي مفتوح",
    report: "لم يتم إصدار كشف بعد"
  };

  records.push(record);
  saveRecords();

  const oldBox = document.getElementById("open").querySelector(".box");
  if (oldBox) {
    oldBox.remove();
  }

  document.getElementById("open").insertAdjacentHTML("beforeend", `
    <div class="box">
      <h3>تم فتح الملف التجريبي بنجاح</h3>

      <div class="info">
        <div class="item">
          <small>رقم الملف الطبي</small>
          <strong>${record.id}</strong>
        </div>

        <div class="item">
          <small>رمز الملف الخاص بك</small>
          <strong>${record.code}</strong>
        </div>

        <div class="item">
          <small>حالة الطلب</small>
          <strong>${record.status}</strong>
        </div>
      </div>

      <p>احتفظ برقم الملف ورمز الملف للحجز أو عرض بيانات الملف لاحقًا.</p>
    </div>
  `);

  document.getElementById("fileLookup").value = record.id;
  document.getElementById("recordCode").value = record.code;
  event.target.reset();
});

function lookupFile() {
  const id = document.getElementById("fileLookup").value.trim();
  const code = document.getElementById("recordCode").value.trim();

  const record = records.find(item =>
    item.id === id && item.code === code
  );

  const area = document.getElementById("lookupResult");

  if (!record) {
    area.innerHTML = `
      <div class="box">
        رقم الملف أو رمز الملف غير متطابقين.
      </div>
    `;
    return;
  }

  area.innerHTML = `
    <div class="box">
      <h3>بيانات الملف للحجز</h3>

      <div class="info">
        <div class="item">
          <small>رقم الملف</small>
          <strong>${record.id}</strong>
        </div>

        <div class="item">
          <small>رمز الملف</small>
          <strong>${record.code}</strong>
        </div>

        <div class="item">
          <small>الاسم</small>
          <strong>${escapeHtml(record.name)}</strong>
        </div>

        <div class="item">
          <small>العمر</small>
          <strong>${escapeHtml(record.age)}</strong>
        </div>

        <div class="item">
          <small>Roblox</small>
          <strong>${escapeHtml(record.roblox)}</strong>
        </div>

        <div class="item">
          <small>الوظيفة والرتبة</small>
          <strong>${escapeHtml(record.job)} - ${escapeHtml(record.rank)}</strong>
        </div>

        <div class="item">
          <small>حالة الكشف</small>
          <strong>${escapeHtml(record.report)}</strong>
        </div>
      </div>

      <p><b>سبب فتح الملف:</b> ${escapeHtml(record.reason)}</p>
      <p>يمكن استخدام رقم الملف لحجز موعد تجريبي داخل نظام الرول بلاي.</p>
    </div>
  `;
}

function loginAdmin() {
  const name = document.getElementById("adminName").value.trim();
  const password = document.getElementById("adminPassword").value;

  if (!name || password !== ADMIN_PASSWORD) {
    alert("بيانات الدخول التجريبية غير صحيحة");
    return;
  }

  sessionStorage.setItem("rp_admin", "1");

  document.getElementById("adminLogin").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  document.getElementById("adminPassword").value = "";
  renderAdmin();
}

function logoutAdmin() {
  sessionStorage.removeItem("rp_admin");

  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminPanel").classList.add("hidden");

  document.getElementById("adminName").value = "";
  document.getElementById("adminPassword").value = "";
}

function renderAdmin() {
  if (sessionStorage.getItem("rp_admin") !== "1") {
    document.getElementById("adminLogin").classList.remove("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
    return;
  }

  document.getElementById("adminLogin").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  let html = `
    <table>
      <thead>
        <tr>
          <th>رقم الملف</th>
          <th>الرمز</th>
          <th>الاسم</th>
          <th>العمر</th>
          <th>Roblox</th>
          <th>الوظيفة</th>
          <th>الرتبة</th>
          <th>السبب</th>
          <th>تقرير الكشف</th>
        </tr>
      </thead>
      <tbody>
  `;

  records.forEach((record, index) => {
    html += `
      <tr>
        <td>${record.id}</td>
        <td>${record.code}</td>
        <td>${escapeHtml(record.name)}</td>
        <td>${escapeHtml(record.age)}</td>
        <td>${escapeHtml(record.roblox)}</td>
        <td>${escapeHtml(record.job)}</td>
        <td>${escapeHtml(record.rank)}</td>
        <td>${escapeHtml(record.reason)}</td>
        <td>
          <input
            id="report-${index}"
            value="${escapeHtml(record.report)}"
            onchange="updateReport(${index}, this.value)"
          >
        </td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  document.getElementById("adminRecords").innerHTML = html;
}

function updateReport(index, report) {
  records[index].report = report;
  saveRecords();
}

function downloadReports() {
  if (sessionStorage.getItem("rp_admin") !== "1") {
    alert("سجّل دخول الإدارة أولًا");
    return;
  }

  if (!records.length) {
    alert("لا توجد سجلات تجريبية للتنزيل");
    return;
  }

  const columns = [
    ["رقم الملف", "id"],
    ["رمز الملف", "code"],
    ["الاسم", "name"],
    ["العمر", "age"],
    ["اسم Roblox", "roblox"],
    ["الوظيفة", "job"],
    ["الرتبة", "rank"],
    ["سبب فتح الملف", "reason"],
    ["الحالة", "status"],
    ["تقرير الكشف", "report"]
  ];

  function csvCell(value) {
    let text = String(value ?? "");

    if (/^[=+\-@]/.test(text)) {
      text = "'" + text;
    }

    return '"' + text.replace(/"/g, '""') + '"';
  }

  const rows = [
    columns.map(column => csvCell(column[0])).join(","),
    ...records.map(record =>
      columns.map(column => csvCell(record[column[1]])).join(",")
    )
  ];

  const csv = "\uFEFF" + rows.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "تقارير-الكشف-الرول-بلاي.csv";
  link.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
